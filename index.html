<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>메뉴 추천</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <meta name="description" content="음식 추천 사이트, 메뉴 추천 사이트, 오늘 뭐 먹지">
</head>
<body>

<div id="toast"></div>

<div class="container">

  <h1 class="title">오늘의 메뉴는?</h1>
  
  <!-- 필터 -->
  <div class="filters">


    <div class="filter-box">
      <h3>카테고리</h3>
      <div class="tag-container">
        <button class="tag-btn" data-tag="한식">한식</button>
        <button class="tag-btn" data-tag="중식">중식</button>
        <button class="tag-btn" data-tag="일식">일식</button>
        <button class="tag-btn" data-tag="양식">양식</button>
        <button class="tag-btn" data-tag="분식">분식</button>
        <button class="tag-btn" data-tag="다이어트식">다이어트식</button>
        <button class="tag-btn" data-tag="아시아">아시아</button>
      </div>
    </div>

    <div class="filter-box">
      <h3>형태/구성</h3>
      <div class="tag-container">
        <button class="tag-btn" data-tag="고기">고기</button>
        <button class="tag-btn" data-tag="빵">빵</button>
        <button class="tag-btn" data-tag="밥">밥</button>
        <button class="tag-btn" data-tag="면">면</button>
        <button class="tag-btn" data-tag="해산물">해산물</button>
        <button class="tag-btn" data-tag="튀김">튀김</button>
        <button class="tag-btn" data-tag="국물">국물</button>
        <button class="tag-btn" data-tag="채소">채소</button>
        <button class="tag-btn" data-tag="수프/죽">수프/죽</button>
      </div>
    </div>

    <div class="filter-box">
      <h3>맛/온도</h3>
      <div class="tag-container">
        <button class="tag-btn" data-tag="맵다">맵다</button>
        <button class="tag-btn" data-tag="느끼함">느끼</button>
        <button class="tag-btn" data-tag="담백">담백</button>
        <button class="tag-btn" data-tag="따뜻함">따뜻함</button>
        <button class="tag-btn" data-tag="시원함">시원함</button>
      </div>
    </div>
    
    <div class="filter-box">
      <h3>상황</h3>
      <div class="tag-container">
        <button class="tag-btn" data-tag="가벼움">가벼움</button>
        <button class="tag-btn" data-tag="패스트푸드">패스트푸드</button>
        <button class="tag-btn" data-tag="든든함">든든함</button>
        <button class="tag-btn" data-tag="건강">건강</button>
        <button class="tag-btn" data-tag="데이트">데이트</button>
        <button class="tag-btn" data-tag="회식">회식</button>
        <button class="tag-btn" data-tag="간식">간식</button>
        <button class="tag-btn" data-tag="안주">안주</button>
      </div>
    </div>

  </div>

  <div id="selected-tags-wrap">
    <div id="selected-tags"></div>
    <button id="clear-tags">전체 초기화</button>
  </div>

  <!-- 버튼 -->
  <div class="top-buttons">
    <button class="btn-primary" onclick="randomPick()">랜덤 추천</button>
  </div>

  <!-- 탭 박스 -->
  <div class="tab-container">

    <div class="tab-buttons">
      <button class="active" onclick="showTab(event, 'list')">메뉴 리스트</button>
      <button onclick="showTab(event, 'historyTab')">식사 기록</button>
    </div>

    <div class="tab-content">

      <!-- 리스트 -->
      <div id="list" class="tab active">
        <div id="message"></div>
        <ul id="result"></ul>
      </div>

      <!-- 히스토리 -->
      <div id="historyTab" class="tab">
        <ul id="history"></ul>

        <div class="history-bottom">
          <button class="btn-primary" onclick="clearHistory()">기록 초기화</button>
        </div>
      </div>

    </div>

  </div>


  <footer>
    <a href="/privacy.html">개인정보처리방침</a>
    <a href="/terms.html">이용약관</a>
  </footer>

</div>

<template id="food-card-template">
  <li class="card">
    <div class="card-img">
      <img class="card-image" src="" alt="food">
    </div>

    <div class="card-body">
      <div class="card-title"></div>
      <div class="card-reason"></div>
    </div>
  </li>
</template>


<div class="floating-info" id="floatingInfo">
  <button class="close-btn" onclick="closeFloating()">✕</button>

  <div class="floating-title">오늘 뭐 먹지?</div>
  <div class="floating-text">
    한식, 중식, 일식, 양식 등 다양한 음식 메뉴를
    카테고리와 태그로 필터링하고,
    랜덤 추천 기능으로 상황에 맞는 메뉴를 선택할 수 있습니다.
  </div>
</div>




<script src="script.js"></script>


</body>
</html>
