<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>메뉴 추천</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <meta name="description" content="한식, 중식, 양식 등 다양한 메뉴 추천. 데이트, 회식 상황별 음식 추천과 랜덤 메뉴 선택 기능 제공">
  

  <title>메뉴 추천 | 한식, 중식, 양식, 데이트, 회식 상황별/취향별 음식 추천</title>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3832407629486566"
  crossorigin="anonymous">
  </script>
  
</head>
<body>

<div id="toast"></div>

<div class="container">

  <h1 class="title">오늘의 메뉴는?</h1>
  
  <!-- 필터 -->
  <div class="filters">


    <div class="filter-box">
      <h3>카테고리</h3>
      <div class="tag-container">
        <button class="tag-btn" data-tag="한식" data-group="category">한식</button>
        <button class="tag-btn" data-tag="중식" data-group="category">중식</button>
        <button class="tag-btn" data-tag="일식" data-group="category">일식</button>
        <button class="tag-btn" data-tag="양식" data-group="category">양식</button>
        <button class="tag-btn" data-tag="분식" data-group="category">분식</button>
        <button class="tag-btn" data-tag="다이어트식" data-group="category">다이어트식</button>
        <button class="tag-btn" data-tag="아시아" data-group="category">아시아</button>
      </div>
    </div>

    <div class="filter-box">
      <h3>형태/구성</h3>
      <div class="tag-container">
        <button class="tag-btn" data-tag="고기" data-group="type">고기</button>
        <button class="tag-btn" data-tag="빵" data-group="type">빵</button>
        <button class="tag-btn" data-tag="밥" data-group="type">밥</button>
        <button class="tag-btn" data-tag="면" data-group="type">면</button>
        <button class="tag-btn" data-tag="해산물" data-group="type">해산물</button>
        <button class="tag-btn" data-tag="튀김" data-group="type">튀김</button>
        <button class="tag-btn" data-tag="국물" data-group="type">국물</button>
        <button class="tag-btn" data-tag="채소" data-group="type">채소</button>
        <button class="tag-btn" data-tag="수프/죽" data-group="type">수프/죽</button>
      </div>
    </div>

    <div class="filter-box">
      <h3>맛/온도</h3>
      <div class="tag-container">
        <button class="tag-btn" data-tag="맵다" data-group="taste">맵다</button>
        <button class="tag-btn" data-tag="느끼함" data-group="taste">느끼</button>
        <button class="tag-btn" data-tag="담백" data-group="taste">담백</button>
        <button class="tag-btn" data-tag="따뜻함" data-group="taste">따뜻함</button>
        <button class="tag-btn" data-tag="시원함" data-group="taste">시원함</button>
      </div>
    </div>
    
    <div class="filter-box">
      <h3>상황</h3>
      <div class="tag-container">
        <button class="tag-btn" data-tag="가벼움" data-group="situation">가벼움</button>
        <button class="tag-btn" data-tag="패스트푸드" data-group="situation">패스트푸드</button>
        <button class="tag-btn" data-tag="든든함" data-group="situation">든든함</button>
        <button class="tag-btn" data-tag="건강" data-group="situation">건강</button>
        <button class="tag-btn" data-tag="데이트" data-group="situation">데이트</button>
        <button class="tag-btn" data-tag="회식" data-group="situation">회식</button>
        <button class="tag-btn" data-tag="간식" data-group="situation">간식</button>
        <button class="tag-btn" data-tag="안주" data-group="situation">안주</button>
      </div>
    </div>

  </div>

  <div id="selected-tags-wrap">
    <div id="selected-tags"></div>
    <button id="clear-tags">전체 초기화</button>
  </div>

  <!-- 버튼 -->
  <div class="top-buttons">
    <button class="btn-primary" onclick="randomPick()">랜덤 추천</button>
  </div>

  <!-- 탭 박스 -->
  <div class="tab-container">

    <div class="tab-buttons">
      <button class="active" onclick="showTab(event, 'list')">메뉴 리스트</button>
      <button onclick="showTab(event, 'historyTab')">식사 기록</button>
    </div>

    <div class="tab-content">

      <!-- 리스트 -->
      <div id="list" class="tab active">
        <div id="message"></div>
        <ul id="result"></ul>
      </div>

      <!-- 히스토리 -->
      <div id="historyTab" class="tab">
        <ul id="history"></ul>

        <div class="history-bottom">
          <button class="btn-primary" onclick="clearHistory()">기록 초기화</button>
        </div>
      </div>

    </div>

  </div>


  <footer>
    <a href="/privacy.html">개인정보처리방침</a>
    <a href="/terms.html">이용약관</a>
  </footer>

</div>

<template id="food-card-template">
  <li class="card">
    <div class="card-img">
      <img class="card-image" src="" alt="food">
    </div>

    <div class="card-body">
      <div class="card-title"></div>
      <div class="card-reason"></div>
    </div>
  </li>
</template>


<div class="floating-info" id="floatingInfo">
  <button class="close-btn" onclick="closeFloating()">✕</button>

  <div class="floating-title">오늘 뭐 먹지?</div>
  <div class="floating-text">
    한식, 중식, 일식, 양식 등 다양한 음식 메뉴를
    카테고리와 태그로 필터링하고,
    랜덤 추천 기능으로 상황에 맞는 메뉴를 선택할 수 있습니다.
  </div>
</div>




<script src="script.js"></script>


</body>
</html>
